{% extends "base.html" %}
{% block title %}Change Password - Library Management System{% endblock %}

{% block content %}
<div class="max-w-md mx-auto space-y-6">
    <div>
        <h1 class="text-2xl font-bold text-slate-800">Change Password</h1>
        <p class="text-sm text-slate-500 mt-0.5">Update your account credentials to keep your library system secure.</p>
    </div>

    <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm">
        <form method="POST" action="{{ url_for('change_password') }}" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-700 mb-1">Current Password *</label>
                <input type="password" name="current_password" required autofocus
                       class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">New Password (Min 6 chars) *</label>
                <input type="password" name="new_password" required minlength="6"
                       class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div>
                <label class="block font-semibold text-slate-700 mb-1">Confirm New Password *</label>
                <input type="password" name="confirm_password" required minlength="6"
                       class="w-full p-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 text-sm">
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md shadow-blue-500/20 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-key"></i>
                    <span>Update Password</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
